resume_path: resume/Sandeep_Kumar_Resume.pdf

search:
  cities: [Delhi, New Delhi, Noida, Greater Noida, Gurgaon, Gurugram, Delhi NCR]   # leads outside these are dropped
  every_hours: 3
  results_per_query: 20
  revisit_days: 3             # refresh pages that can gain new openings
  retry_days: 3               # retry missing contacts or failed draft generation
  rotating_queries: 9        # additional role/city/source combinations per cycle
  # {city} is replaced with each entry of cities_for_queries.
  cities_for_queries: [Delhi, Noida, Gurgaon]
  queries:
    - AI engineer job opening startup {city}
    - GenAI engineer hiring {city} startup
    - LLM engineer hiring {city}
    - machine learning engineer job {city} startup
    - AI startup {city} careers
    - top AI startups in {city} 2026
    - list of generative AI companies {city} NCR
    - generative AI startup {city}
    - site:wellfound.com AI startup {city}
    - site:cutshort.io AI engineer {city}
    - site:instahyre.com AI engineer {city}
    - site:linkedin.com/jobs "AI Engineer" {city}
    - 'site:linkedin.com/posts "AI Engineer" hiring {city}'
    - 'site:linkedin.com/posts "GenAI" hiring {city} email'
    - 'site:linkedin.com/feed/update "AI" hiring {city}'
    - '{city} AI startup hiring "careers@" OR "hr@"'
    - 'AI startup {city} jobs hiring'

filters:
  max_employees: 200          # "small company" cutoff (LLM estimate)
  # Never email these (matched anywhere in the company name, website or email address).
  never_contact: [dhruva, dhurva]
  # Big companies are skipped: their HR inboxes don't answer cold emails.
  blocklist: [google, microsoft, amazon, meta, apple, ibm, accenture, tcs, infosys, wipro, hcl, cognizant,
              capgemini, deloitte, pwc, ey, kpmg, oracle, adobe, samsung, paytm, zomato, flipkart, nvidia,
              naukri, indeed, linkedin, glassdoor, internshala, foundit, shine, timesjobs, wellfound,
              cutshort, instahyre, hirist, iimjobs, apna, upgrad, simplilearn, coursera]

sending:
  auto_send: false            # true = send without asking you. Keep false.
  daily_limit: 20             # Gmail flags accounts that cold-email a lot; stay low.
  min_gap_seconds: 90         # pause between two sends
  followup_after_days: 0      # 0 = never send a follow-up
