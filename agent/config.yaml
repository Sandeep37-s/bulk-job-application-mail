  linkedin: ""            # TODO: full LinkedIn URL
  github: https://github.com/Sandeep37-s
  current_role: AI Engineer at Dhruva Technology
  target_roles: [AI Engineer, GenAI Engineer, ML Engineer, LLM Engineer, Data Scientist]
  # Facts the email writer may use. It is told never to invent anything beyond this.
  facts: |
    - Currently working as an AI Engineer at Dhruva Technology (since Jul 2026).
