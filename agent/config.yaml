resume_path: resume/Sandeep_Kumar_Resume.pdf

search:
  # Leads whose city matches none of these are dropped ("India" also keeps any lead the
  # search tagged with the country, e.g. "Surat, India").
  cities: [India, Bangalore, Bengaluru, Hyderabad, Pune, Mumbai, Navi Mumbai, Thane, Chennai, Delhi, New Delhi,
           Noida, Greater Noida, Gurgaon, Gurugram, Delhi NCR, Faridabad, Ghaziabad, Ahmedabad, Gandhinagar,
           Kolkata, Jaipur, Kochi, Cochin, Thiruvananthapuram, Trivandrum, Coimbatore, Indore, Chandigarh,
           Mohali, Bhubaneswar, Lucknow, Nagpur, Vadodara, Surat, Mysore, Mysuru, Visakhapatnam, Mangalore, Bhopal]
  every_hours: 6
  results_per_query: 20
  revisit_days: 3             # refresh pages that can gain new openings
  retry_days: 3               # retry missing contacts or failed draft generation
  rotating_queries: 9        # additional role/city/source combinations per cycle
  # {city} is replaced with cities_per_cycle entries of cities_for_queries, rotating each
  # cycle, so covering more cities does not add searches or AI calls per cycle.
  cities_for_queries: [Bangalore, Hyderabad, Pune, Delhi, Mumbai, Noida, Gurgaon, Chennai, Ahmedabad,
                       Kolkata, Jaipur, Kochi, Indore, Chandigarh, Coimbatore, Thiruvananthapuram, India, remote India]
  cities_per_cycle: 3
  queries:
    - AI engineer job opening startup {city}
    - GenAI engineer hiring {city} startup
    - LLM engineer hiring {city}
    - machine learning engineer job {city} startup
    - AI startup {city} careers
    - top AI startups in {city} 2026
    - funded generative AI startup {city} hiring
    - generative AI startup {city}
    - site:wellfound.com AI startup {city}
    - site:cutshort.io AI engineer {city}
    - site:instahyre.com AI engineer {city}
    - site:linkedin.com/jobs "AI Engineer" {city}
    - 'site:linkedin.com/posts "AI Engineer" hiring {city}'
    - 'site:linkedin.com/posts "GenAI" hiring {city} email'
    - 'site:linkedin.com/feed/update "AI" hiring {city}'
    - '{city} AI startup hiring "careers@" OR "hr@"'
    - 'AI startup {city} jobs hiring'

filters:
  max_employees: 500          # startup / small-company cutoff (LLM estimate)
  # Never email these (matched anywhere in the company name, website or email address).
  never_contact: [dhruva, dhurva]
  # Addresses that bounced; never email them again.
  bounced: [vivek@algosoftech.in, hr@raushang4.tech, info@hanux.org, himanshu.jangir@vegavid.com,
            jane.doe@niyog.co, recruitment@polluxa.com, priya@company.com, info@companydetails.in, neuros@mail.co]
  # Big companies are skipped: their HR inboxes don't answer cold emails.
  blocklist: [google, microsoft, amazon, meta, apple, ibm, accenture, tcs, infosys, wipro, hcl, cognizant,
              capgemini, deloitte, pwc, ey, kpmg, oracle, adobe, samsung, paytm, zomato, flipkart, nvidia,
              naukri, indeed, linkedin, glassdoor, internshala, foundit, shine, timesjobs, wellfound,
              cutshort, instahyre, hirist, iimjobs, apna, upgrad, simplilearn, coursera]

efficiency:
  extraction_cache_days: 7   # reuse identical inputs; changed posts are reprocessed

sending:
  auto_send: true             # send eligible advertised AI/ML roles automatically
  daily_limit: 40             # maximum attempts, including uncertain SMTP deliveries
  min_gap_seconds: 660        # at least 11 minutes between attempts...
  gap_jitter_seconds: 240     # ...plus a random 0-4 minutes, so about every 13 minutes
  send_hours: "09:30-19:30"   # India time; empty = any time of day
  send_days: [Mon, Tue, Wed, Thu, Fri, Sat]
  followup_after_days: 0      # 0 = never send a follow-up

